[project]
name = "pce-extrapolation"
version = "0.1.0"
description = "PCE extrapolation baseline (MOE2 + P3) on OPV2D, with extensible algorithm framework"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch==2.4.1",
    "torch-geometric>=2.7.0",
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "rdkit>=2024.3.5",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tensorboard>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
