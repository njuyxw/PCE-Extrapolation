# --------------------------------------------------------------------------
# rank_focal + ensemble — the recommended algorithm on this repo.
#
# Default split is `discovery_mix`: train on bulk (PCE < 11.87 cutoff),
# test on a mix of bulk + every high-PCE pair, mimicking real OPV
# screening. The ensemble blends rank_focal's learned PCE with the
# Scharber/Imamura/Alharbi physics formulas computed from MOE2-predicted
# HOMO_D / LUMO_A. α = 0.3 is the Pareto knee on the mixed test (R²
# stays positive on bulk while the tail R² jumps from -4 to ~0).
#
# Train:    python scripts/07_train_rank_focal.py --config configs/rank_focal.yaml
# Ensemble: python scripts/09_ensemble_physics_rank.py --config configs/rank_focal.yaml \
#               ensemble.fold_ckpt=outputs/rank_focal_discovery_mix/fold1_best.pt
# Eval:     python scripts/13_evaluate_discovery_mix.py \
#               --diagnostics outputs/rank_focal_discovery_mix/ensemble/fold1_diagnostics.csv
# --------------------------------------------------------------------------

seed: 42
device: cuda

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  ckpt_dir: checkpoints
  out_dir: outputs

data:
  opv_csv: data/processed/opv2d_clean.csv
  y6_csv: data/processed/opv2d_y6.csv
  lopez_csv: data/raw/lopez51k.csv
  opv_full_csv: data/raw/opv2d.csv
  max_smiles_len: 600

split:
  kind: discovery_mix
  kwargs:
    high_pce_quantile: 0.85
    test_bulk_frac: 0.10
    val_frac: 0.10
    seed: 42

predictor:
  kind: p3_physics              # MOE2 encoders + Scharber-anchored Voc + multi-output (Voc, Jsc, FF, δPCE)
  kwargs:
    in_channels: 31
    edge_dim: 15
    hidden_channels: 512
    out_channels: 512
    homolumo_targets: 2
    pce_targets: 1
    dropout_rate: 0.25
    num_heads: 8
    encoder_kind: moe2
    voc_offset: 0.30
    voc_clamp_min: 0.0
    voc_clamp_max: 2.5
    voc_residual_scale: 0.20
    ff_min: 0.30
    ff_max: 0.85
    jsc_min: 1.0
    jsc_max: 35.0
    pce_residual_scale: 0.5

# RankFocalLoss — position-weighted ListMLE + top-quantile pairwise margin.
loss:
  pce: 0.5
  aux: 0.5
  rank: 1.0
  margin: 0.5
  phys: 0.05
  margin_quantile: 0.7
  margin_target_diff_min: 0.5
  margin_value: 0.3

# Tail-weighted sampling: weight ∝ ((PCE - PCE_min)/(PCE_max - PCE_min) + ε)^α
sampling:
  tail_alpha: 2.0

# Physics-committee × learned-model ensemble (M3 fixed blend).
ensemble:
  fold_ckpt: outputs/rank_focal_discovery_mix/fold1_best.pt
  moe2_ckpt: checkpoints/moe2_calc.pt
  alpha: 0.3                    # Pareto-knee on discovery_mix; α=0.5 for pure tail
  physics_subset: Scharber,Imamura,Alharbi

trainer:
  pretrained_encoder_ckpt: checkpoints/moe2_calc.pt
  out_subdir: rank_focal_discovery_mix
  batch_size: 32
  epochs: 100
  warmup_epochs: 20
  lr: 1.0e-4
  unfreeze_lr_scale: 0.1
  weight_decay: 5.0e-4
  grad_clip: 1.0
  early_stop_patience: 30
  min_delta: 1.0e-4
  lr_patience: 3
  lr_factor: 0.5
  num_workers: 2
  device: cuda
